[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envshield"
version = "4.3.0"  # must be a string for PEP 621 compliance
description = "EnvShield: A CLI for secure local environment management and secret prevention."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Rabbil Yasar Sajal", email = "rabbilyasar@gmail.com" }
]
keywords = ["environment", "security", "secrets", "cli", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities"
]

dependencies = [
    "PyYAML>=6.0,<7.0",
    "rich>=13.0,<15.0",
    "questionary>=2.0,<3.0",
    "typer[all]>=0.9,<1.0",
    "toml>=0.10,<1.0"
]

[project.scripts]
envshield = "envshield.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.16,<0.17",
    "pytest",
    "pytest-mock",
    "bump2version",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow and pinned: correctness (pyflakes) + real
# pycodestyle errors + import sorting. CI's "ruff check ." previously ran
# with zero project config, at the mercy of ruff's own (much broader, and
# expanding) default rule set -- that's exactly why it kept silently
# breaking release after release. Widen this set as a deliberate choice,
# not by letting a ruff upgrade decide for you.
select = ["E", "F", "I"]
# Long, deliberately-explanatory comments/docstrings are this codebase's own
# established convention -- enforcing a line-length limit would fight that
# style rather than catch a real problem. The formatter's own default width
# (88) still applies to actual code, comments/docstrings just aren't capped.
ignore = ["E501"]

