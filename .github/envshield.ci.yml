# This is a special configuration file for our CI pipeline.
# It tells the EnvShield scanner to ignore its own test files,
# which are expected to contain example secrets.
secret_scanning:
    exclude_files:
    - "./envshield/tests/*"
    - "myvenv/*"
    - "exclude venv/*"
    # README.md's own documented example output (sample scan results,
    # illustrative fake credentials) -- not a real secret.
    - "./README.md"
    # BACKLOG.md quotes illustrative secret-shaped/connection-string-shaped
    # example text as part of documenting real findings (a synthetic test
    # value explicitly named to say it isn't real, a connection-string
    # template, an example URL used to illustrate validator behavior) --
    # same category as README.md above, not a real leak.
    - "./BACKLOG.md"
    # .gif/ holds the shell scripts used to record the README's demo
    # GIFs, seeded with obviously-fake Stripe test keys for the recording.
    - "./.gif/*"
    # These files *are* the secret-detection patterns/heuristics/classifiers --
    # scanning code that talks about "key"/"secret" identifiers next to
    # '=' will always self-trigger the generic-API-key pattern. The classifier
    # module contains documented example API keys in docstrings. Not a leak.
    - "./envshield/core/importer.py"
    - "./envshield/core/scanner.py"
    - "./envshield/classifier/*"
