name: Publish to PyPI

# Triggered by `git push --tags` after a `bump2version` release (see
# CONTRIBUTING.md). A tag push is a separate, independent trigger event
# from ci.yml's own `push: branches: [main]` trigger -- there is no
# ordering guarantee between the two, and no reliable way to look up
# "did ci.yml already pass for this exact commit" without introducing
# workflow_run polling against the Checks API. So this job is
# self-contained: it re-runs the same checks, on the same Python
# versions, that ci.yml's test-and-lint job runs, directly against the
# exact tagged commit, before it ever reaches PyPI. Keep this matrix and
# step list in sync with ci.yml's test-and-lint job -- this is the
# repository's actual release gate, not merely a sanity check.
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit tests with pytest
        run: pytest

      - name: Scan codebase with EnvShield
        run: |
          envshield scan . --config .github/envshield.ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC) -- no token needed
      contents: write # required to create the matching GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create matching GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
